[workspace]
resolver = "2"
members = ["crates/statehound"]
# scripts/install.sh builds the everystate engine below target/build: not part of this workspace
exclude = ["target"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/allthingssecurity/statehound"

[profile.release]
lto = "thin"
codegen-units = 1
